services:
  mongo:
    image: mongo:8
    container_name: rydora-mongo
    command: ["mongod", "--port", "27018", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27018"
    volumes:
      - rydora-mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --port 27018 --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27018'}]}).ok }\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rydora-mongo-data:

